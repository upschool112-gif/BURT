<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>UPS BURT Reading Assessment</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fa;color:#272238;font:15px system-ui,sans-serif}header{background:#55318c;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:24px;margin:0}small{opacity:.85}main{max-width:1500px;margin:25px auto;padding:0 20px}.panel{background:white;border:1px solid #e1d9ee;border-radius:14px;padding:20px;margin-bottom:16px}.login{max-width:420px;margin:70px auto}label{display:block;font-weight:600;margin-bottom:6px}input,select,button{font:inherit;padding:10px;border:1px solid #cfc3df;border-radius:7px}button{background:#6842a2;color:white;border:none;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input:focus,select:focus{outline:2px solid #8f64c9}input[type=email]{width:100%;margin-bottom:14px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.scroll{overflow:auto;max-height:62vh}table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#ece5f8;z-index:1;white-space:nowrap}td input{width:82px;padding:6px}td:first-child{min-width:200px}td:last-child{min-width:220px}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{background:#f2edf9;padding:14px;border-radius:9px;min-width:130px}.stat strong{display:block;font-size:23px;color:#55318c}.status{white-space:pre-wrap;margin:12px 0;min-height:20px} .bad{color:#a12435}.good{color:#17683e}.warn{color:#8a5900} [hidden]{display:none!important}dialog{max-width:750px;width:94%;border:1px solid #d1c3e5;border-radius:12px}dialog::backdrop{background:#201a3566}@media print{header button,.toolbar,button,#login,#notice{display:none!important}.scroll{max-height:none;overflow:visible}main{margin:0;padding:0}.panel{border:0}th{position:static}}</style></head><body><header><div><h1>UPS BURT</h1><small>Reading Assessment System</small></div><button id="logout" hidden>Sign out</button></header><main><div id="notice" class="status" role="status" aria-live="polite"></div><section id="login" class="panel login"><h2>School email sign-in</h2><p>Use your registered school email. A secure sign-in link will be sent to your inbox.</p><form id="loginForm"><label for="email">School email</label><input id="email" type="email" autocomplete="email" required><button id="send">Send sign-in link</button></form></section><section id="app" hidden><div class="panel"><div id="identity"></div><div class="toolbar"><div><label for="year">Academic year</label><select id="year"></select></div><div><label for="class">Class</label><select id="class"></select></div><div><label for="term">Assessment</label><select id="term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option><option value="final">Final results</option></select></div><button id="reload">Refresh</button><button id="save">Save changes</button><button id="print">Print report</button><button id="export">Export CSV</button></div></div><section class="panel" id="coverage" hidden><h3>Grade coverage (administrator)</h3><div id="grades" class="toolbar"></div></section><section class="panel"><h2 id="heading">Class assessment</h2><div id="stats" class="stats"></div><div class="scroll"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></section></section></main><dialog id="detail"><h2 id="detailTitle"></h2><div id="detailBody"></div><button id="closeDetail">Close</button></dialog><script type="module" src="./app.js"></script></body></html>
